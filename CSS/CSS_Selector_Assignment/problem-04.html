<!DOCTYPE html>
<html>
<head>
    <title>Problem 4 - Interactive Periodic Table</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #ffffff;
            padding: 40px 20px;
        }
        h1 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 30px;
            letter-spacing: 1px;
            color: #222;
        }
        .table-container {
            max-width: 950px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
        }
        .main-grid {
            display: grid;
            grid-template-columns: repeat(18, 35px);
            grid-template-rows: repeat(7, 35px);
            gap: 5px;
        }
        .elem {
            width: 35px;
            height: 35px;
            border-radius: 2px;
            border: 1px solid #777;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            color: #333;
        }
        .empty {
            border: none;
        }
        
        /* Color themes based on reference */
        .col-red { background-color: #d32f2f; color: white; border-color: #b71c1c; }
        .col-lightgreen { background-color: #8bc34a; }
        .col-darkgreen { background-color: #4caf50; }
        .col-orange { background-color: #ff9800; }
        .col-blue { background-color: #0022ff; color: white; }
        .col-pink { background-color: #e91e63; }
        .col-purple { background-color: #9c27b0; }
        .col-yellow { background-color: #ffeb3b; }
        .col-grey { background-color: #607d8b; }
        .col-brown { background-color: #795548; }

        /* Highlight box for Silicon */
        .elem-si {
            grid-column: 14;
            grid-row: 3;
            width: 75px;
            height: 75px;
            background-color: #8bc34a;
            border: 2px solid #333;
            position: relative;
            display: block;
            padding: 5px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
            transform: translate(-15px, -15px);
        }
        .elem-si .num {
            position: absolute;
            top: 2px;
            right: 5px;
            font-size: 11px;
            color: #333;
        }
        .elem-si .sym {
            font-size: 24px;
            font-weight: bold;
            color: #222;
            margin-top: 5px;
            display: block;
            text-align: left;
        }
        .elem-si .name {
            font-size: 10px;
            color: #444;
            display: block;
            text-align: left;
            margin-top: 2px;
        }

        /* Bottom Row Lanthanides/Actinides */
        .bottom-row {
            display: grid;
            grid-template-columns: 35px repeat(14, 35px);
            gap: 5px;
            margin-top: 10px;
        }
        .lanth-label {
            background-color: #4f6d55;
            color: white;
            font-size: 9px;
            border: 1px solid #333;
        }
        .bottom-elem {
            background-color: #6b8e23;
            border: 1px solid #555;
        }
    </style>
</head>
<body>

    <h1>THE PERIODIC TABLE OF ELEMENTS</h1>

    <div class="table-container">
        <div class="main-grid">
            <!-- Row 1 -->
            <div class="elem col-red">H</div>
            <div class="empty" grid-span="16"></div>
            <!-- loop fill placeholders mapping user layout -->
            <div class="elem col-yellow" style="grid-column:18;"></div>

            <!-- Row 2 -->
            <div class="elem col-lightgreen" style="grid-row:2; grid-column:1;"></div>
            <div class="elem col-orange" style="grid-row:2; grid-column:2;">4</div>
            <div class="elem col-pink" style="grid-row:2; grid-column:13;"></div>
            <div class="elem col-purple" style="grid-row:2; grid-column:14;"></div>
            <div class="elem col-pink" style="grid-row:2; grid-column:15;"></div>
            <div class="elem col-purple" style="grid-row:2; grid-column:16;"></div>

            <div class="elem col-orange" style="grid-row:4; grid-column:15;"></div>
            <div class="elem col-purple" style="grid-row:4; grid-column:16;"></div>

            <!-- Row 7 -->
            <div class="elem col-lightgreen" style="grid-row:7; grid-column:1;"></div>
            <div class="elem col-orange" style="grid-row:7; grid-column:2;">88</div>

            <div class="elem col-grey" style="grid-row:7; grid-column:16;"></div>

        <!-- Bottom Rows for Lanthanides/Actinides -->

</body>
</html>
