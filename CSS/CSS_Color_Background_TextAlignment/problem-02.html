<!DOCTYPE html>
<html>
<head>
    <title>Problem 2 - Restaurant Special Menu</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 20px; background-color: #FFFDE7;">
    <div style="background-color: #8B0000; color: white; text-align: center; padding: 20px; border-radius: 4px;">
        <h1 style="margin: 0; font-size: 28px;">Tasty Bites Restaurant</h1>
        <p style="margin: 5px 0 0 0; font-style: italic;">Good Food Makes a Better Mood</p>
    </div>

    <div style="margin-top: 20px; padding: 10px;">
        <h2 style="text-align: center; color: #8B0000;">Our Special Dishes</h2>
        
        <table style="width: 100%; border-collapse: collapse; margin-top: 15px; background-color: white;">
            <thead>
                <tr style="background-color: orange; color: black;">
                    <th style="border: 1px solid #ddd; padding: 12px; text-align: left;">Dish Name</th>
                    <th style="border: 1px solid #ddd; padding: 12px; text-align: left;">Type</th>
                    <th style="border: 1px solid #ddd; padding: 12px; text-align: left;">Price</th>
                </tr>
            </thead>
            <tbody>
                <tr style="background-color: rgb(255, 248, 240);">
                    <td style="border: 1px solid #ddd; padding: 10px;">Margherita Pizza</td>
                    <td style="border: 1px solid #ddd; padding: 10px;">Veg</td>
                    <td style="border: 1px solid #ddd; padding: 10px;">&Iacute;ndia &nbsp; ₹249</td>
                </tr>
                <tr style="background-color: rgb(255, 255, 255);">
                    <td style="border: 1px solid #ddd; padding: 10px;">Paneer Butter Masala</td>
                    <td style="border: 1px solid #ddd; padding: 10px;">Veg</td>
                    <td style="border: 1px solid #ddd; padding: 10px;">₹279</td>
                </tr>
                <tr style="background-color: rgb(255, 248, 240);">
                    <td style="border: 1px solid #ddd; padding: 10px;">Chicken Biryani</td>
                    <td style="border: 1px solid #ddd; padding: 10px;">Non-Veg</td>
                    <td style="border: 1px solid #ddd; padding: 10px;">₹299</td>
                </tr>
                <tr style="background-color: rgb(255, 255, 255);">
                    <td style="border: 1px solid #ddd; padding: 10px;">Chocolate Brownie</td>
                    <td style="border: 1px solid #ddd; padding: 10px;">Dessert</td>
                    <td style="border: 1px solid #ddd; padding: 10px;">₹149</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div style="background-color: pink; color: maroon; text-align: center; padding: 15px; margin-top: 20px; font-weight: bold; border-radius: 4px;">
        Visit Us &amp; Enjoy Delicious Food!
    </div>

    <div style="background-color: #333333; color: white; padding: 15px; margin-top: 20px; border-radius: 4px; overflow: hidden;">
        <div style="float: left; width: 50%; text-align: left;">Open Daily: 11 AM &ndash; 11 PM</div>
        <div style="float: right; width: 50%; text-align: right;">Thank You!</div>
    </div>

</body>
</html>
